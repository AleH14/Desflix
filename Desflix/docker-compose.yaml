services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: desflix-sqlserver
    environment:
      SA_PASSWORD: "YourStrongPassword123!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - desflix-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrongPassword123! -C -Q 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desflix-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Peliculas;User Id=sa;Password=YourStrongPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;
    ports:
      - "5000:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - desflix-network
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  desflix-network:
    driver: bridge
